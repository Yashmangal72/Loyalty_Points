spring.application.name=loyalty-points

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loyalty_points}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-key-for-development-only-please-use-a-long-random-secret}
app.jwt.expiration=86400000

# CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}